<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amazon Wishlist Filter / Deal Query</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head><body><h1>Wishlist Studio</h1><p>Offline prototype. Initial items and prices are illustrative, not live Amazon data.</p><p>CSV columns, in order: product name, category, current price.</p><div id="upload-container"><input type="file" accept="text/csv" id="csv-upload"> <button id="upload-btn">Upload Wishlist</button> <p id="upload-status" role="status" aria-live="polite"></p><label for="paste-csv">Or paste CSV</label><textarea id="paste-csv" rows="4" placeholder="product name,category,current price"></textarea><button id="paste-btn">Import pasted CSV</button></div><div id="filters"><label for="sales-event">Product search:</label><input type="text" id="sales-event"> <label for="category-filter">Category Filter:</label><input type="text" id="category-filter"></div><div id="results-container"></div></body></html>
